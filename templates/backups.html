<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} - Backups</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:14px;">
    <img src="/static/logo.png" alt="logo" style="height:38px;width:38px;border-radius:8px;object-fit:cover;border:1px solid #30363d;">
    <h1>{{ .Title }} - Backups</h1>
  </div>
  <div class="nav-links">
    <a href="/" data-i18n="nav.dashboard">Dashboard</a>
    <a href="/map" data-i18n="nav.map">Map</a>
    <a href="/config" data-i18n="nav.config">Config</a>
    <a href="/backups" class="active" data-i18n="nav.backups">Backups</a>
    <a href="/logs" data-i18n="nav.logs">Logs</a>
    <a href="/api-docs" data-i18n="nav.api">API</a>
    <select id="lang-select" style="margin-left:8px;padding:4px 6px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:11px;cursor:pointer;" onchange="setLang(this.value)">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>
</div>

<div class="container">
  <div id="table-wrapper" class="card-full">
    <div id="backup-empty" class="empty-state" style="display:none;padding:40px;">
      <h3>No backups yet</h3>
      <p>Trigger a backup from the switch card on the dashboard.</p>
    </div>
  </div>
</div>

<div class="modal-confirm-overlay" id="delete-modal">
  <div class="modal-confirm">
    <h3>Delete Backup</h3>
    <p id="modal-filename-display">Are you sure?</p>
    <div class="btns">
      <button class="btn btn-secondary" onclick="closeDelete()">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm-btn">Delete</button>
    </div>
  </div>
</div>

<div id="toast-box" class="toast-container" style="display:none;">
  <span id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script>
function closeDelete() { document.getElementById('delete-modal').classList.remove('open'); }
</script>
<script type="module" src="/static/dist/backups.js"></script>
</body>
</html>
