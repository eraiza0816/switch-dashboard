<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} - Backups</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <h1>{{ .Title }} - Backups</h1>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/config">Config</a>
    <a href="/backups" class="active">Backups</a>
    <a href="/logs">Logs</a>
    <a href="/api-docs">API</a>
  </div>
</div>

<div class="container">
  <div id="table-wrapper" class="card-full">
    <div id="backup-empty" class="empty-state" style="display:none;padding:40px;">
      <h3>No backups yet</h3>
      <p>Trigger a backup from the switch card on the dashboard.</p>
    </div>
  </div>
</div>

<div class="modal-confirm-overlay" id="delete-modal">
  <div class="modal-confirm">
    <h3>Delete Backup</h3>
    <p id="modal-filename-display">Are you sure?</p>
    <div class="btns">
      <button class="btn btn-secondary" onclick="closeDelete()">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm-btn">Delete</button>
    </div>
  </div>
</div>

<div id="toast-box" class="toast-container" style="display:none;">
  <span id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script>
function closeDelete() { document.getElementById('delete-modal').classList.remove('open'); }
</script>
<script src="/static/dist/backups.js"></script>
</body>
</html>
