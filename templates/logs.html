<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} - Logs</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <h1>{{ .Title }} - Logs</h1>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/config">Config</a>
    <a href="/backups">Backups</a>
    <a href="/logs" class="active">Logs</a>
    <a href="/api-docs">API</a>
  </div>
</div>

<div class="container">
  <div class="card-full">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
      <div>
        <label style="font-size:11px;color:#8b949e;margin-right:6px;">Log Level</label>
        <select id="log-level" onchange="updateLogLevel(this.value)" style="padding:4px 8px;font-size:12px;">
          <option value="DEBUG" {{ if eq .CurrentLogLevel "DEBUG" }}selected{{ end }}>DEBUG</option>
          <option value="INFO" {{ if eq .CurrentLogLevel "INFO" }}selected{{ end }}>INFO</option>
          <option value="WARNING" {{ if or (eq .CurrentLogLevel "WARNING") (eq .CurrentLogLevel "WARN") }}selected{{ end }}>WARNING</option>
          <option value="ERROR" {{ if eq .CurrentLogLevel "ERROR" }}selected{{ end }}>ERROR</option>
          <option value="CRITICAL" {{ if eq .CurrentLogLevel "CRITICAL" }}selected{{ end }}>CRITICAL</option>
          <option value="NONE" {{ if eq .CurrentLogLevel "NONE" }}selected{{ end }}>NONE</option>
        </select>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-secondary" onclick="document.getElementById('log-file-download').click()">Download</a>
        <a id="log-file-download" href="/api/logs/download" style="display:none;"></a>
        <button class="btn btn-danger" onclick="clearLogs()">Clear</button>
      </div>
    </div>
    <div id="log-container" style="background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:11px;height:500px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.6;"></div>
  </div>
  <div id="autoscroll-banner" style="display:none;text-align:center;cursor:pointer;padding:6px;background:rgba(88,166,255,0.1);border:1px solid rgba(88,166,255,0.2);border-radius:8px;font-size:11px;color:#58a6ff;margin-top:8px;" onclick="resumeAutoscroll()">Auto-scroll Paused - Click to resume</div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/static/logs.js"></script>
</body>
</html>
