<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} - Network Map</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<style>
  #map-canvas { width:100%; height:calc(100vh - 60px); position:relative; overflow:hidden; background:#0d1117; }
  .node-group:hover rect { filter: brightness(1.2); }
  .search-item { padding:6px 10px; cursor:pointer; display:flex; gap:8px; align-items:center; font-size:12px; color:#c9d1d9; border-bottom:1px solid #21262d; }
  .search-item:hover { background:rgba(88,166,255,0.1); }
  .info-row { display:flex; justify-content:space-between; padding:4px 0; font-size:11px; border-bottom:1px solid #21262d; }
  .info-row .label { color:#8b949e; }
  .info-row .value { color:#f0f6fc; font-family:'JetBrains Mono',monospace; }
  #sidebar { position:absolute; top:0; right:0; width:280px; height:100%; background:rgba(22,27,34,0.95); border-left:1px solid #30363d; backdrop-filter:blur(12px); overflow-y:auto; z-index:10; }
</style>
</head>
<body>
<div class="header">
  <h1>{{ .Title }} - <span data-i18n="map.title">Network Map</span></h1>
  <div class="nav-links">
    <a href="/" data-i18n="nav.dashboard">Dashboard</a>
    <a href="/map" class="active" data-i18n="nav.map">Map</a>
    <a href="/config" data-i18n="nav.config">Config</a>
    <a href="/backups" data-i18n="nav.backups">Backups</a>
    <a href="/logs" data-i18n="nav.logs">Logs</a>
    <a href="javascript:toggleClients()" style="font-size:11px;" data-i18n="map.toggle_clients">Toggle Clients</a>
    <a href="javascript:resetLayout()" style="font-size:11px;color:#d29922;" data-i18n="map.reset_layout">Reset Layout</a>
    <a href="javascript:bulkRename()" style="font-size:11px;color:#d29922;" data-i18n="map.bulk_rename">Bulk Rename</a>
    <select id="lang-select" style="margin-left:8px;padding:4px 6px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:11px;cursor:pointer;" onchange="setLang(this.value)">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>
</div>

<div style="position:absolute;top:70px;left:16px;z-index:10;width:240px;">
  <input id="search-input" type="text" placeholder="Search nodes..." data-i18n-placeholder="map.search_placeholder" style="width:100%;padding:6px 10px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:12px;">
  <div id="search-results" style="background:#161b22;border:1px solid #30363d;border-radius:8px;margin-top:4px;"></div>
</div>

<div id="sidebar" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #30363d;">
    <span style="font-size:13px;font-weight:600;color:#f0f6fc;" data-i18n="map.details">Details</span>
    <button id="sidebar-close" style="background:none;border:none;color:#8b949e;cursor:pointer;font-size:18px;">&times;</button>
  </div>
  <div id="sidebar-content"></div>
</div>

<div id="map-canvas">
  <div id="map-loading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#8b949e;font-size:14px;" data-i18n="map.loading">Loading topology...</div>
</div>

<div id="toast-box" class="toast-container" style="display:none;">
  <span id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script type="module" src="/static/dist/map.js"></script>
</body>
</html>
