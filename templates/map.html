<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} - Network Map</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<style>
  #map-canvas { width:100%; height:calc(100vh - 60px); position:relative; overflow:hidden; background:#0d1117; }
  #map-canvas svg { width:100%; height:100%; }
  .node circle { cursor:pointer; transition:r .2s; }
  .node:hover circle { r: 22; }
  .node text { pointer-events:none; }
  .link line { stroke-width:2; }
  .port-label { font-size:9px; fill:#8b949e; font-family:'JetBrains Mono',monospace; }
  .node-name { font-size:11px; fill:#f0f6fc; font-weight:500; }
  .node-type { font-size:9px; fill:#8b949e; }
  .tooltip { position:absolute; background:#1c2128; border:1px solid #30363d; border-radius:8px; padding:8px 12px; font-size:11px; pointer-events:none; z-index:10; display:none; }
</style>
</head>
<body>
<div class="header">
  <h1>{{ .Title }} - Network Map</h1>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/map" class="active">Map</a>
    <a href="/config">Config</a>
    <a href="/backups">Backups</a>
    <a href="/logs">Logs</a>
  </div>
</div>
<div id="map-canvas"><svg id="map-svg"></svg></div>
<div class="tooltip" id="tooltip"></div>

<script>
async function loadMap() {
  const res = await fetch('/api/topology');
  const data = await res.json();
  const svg = document.getElementById('map-svg');
  const W = svg.clientWidth || window.innerWidth;
  const H = svg.clientHeight || (window.innerHeight - 60);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const switches = data.nodes.filter(n => n.type === 'switch');
  const clients = data.nodes.filter(n => n.type === 'client');

  let html = `<rect width="${W}" height="${H}" fill="#0d1117"/>`;

  // Layout: switches on left, clients distributed on right
  const cx = W * 0.25;
  const cy = H / 2;
  const radius = Math.min(W, H) * 0.35;

  // Draw links
  for (const link of data.links) {
    const src = data.nodes.find(n => n.id === link.source);
    const tgt = data.nodes.find(n => n.id === link.target);
    if (!src || !tgt) continue;
    const isSwitch = tgt.type === 'switch';
    const idx = data.links.filter(l => l.source === link.source).indexOf(link);
    const total = data.links.filter(l => l.source === link.source).length;
    const angle = total > 1 ? -Math.PI/2 + (idx / (total-1)) * Math.PI : -Math.PI/2;
    const tx = cx + radius * Math.cos(angle);
    const ty = cy + radius * Math.sin(angle);

    html += `<g class="link"><line x1="${cx}" y1="${cy}" x2="${tx}" y2="${ty}" stroke="#30363d" `;
    if (link.source_port) {
      const mx = (cx + tx) / 2;
      const my = (cy + ty) / 2;
      html += `/><text x="${mx}" y="${my - 6}" text-anchor="middle" class="port-label">${link.source_port}</text>`;
    } else {
      html += `/>`;
    }
    html += `</g>`;
  }

  // Draw switch node
  html += `<g class="node"><circle cx="${cx}" cy="${cy}" r="20" fill="rgba(88,166,255,0.2)" stroke="#58a6ff" stroke-width="2"/>`;
  html += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">S</text>`;
  html += `<text x="${cx}" y="${cy + 32}" text-anchor="middle" class="node-name">${switches[0]?.name || 'Switch'}</text>`;
  html += `<text x="${cx}" y="${cy + 44}" text-anchor="middle" class="node-type">${switches[0]?.model || ''}</text></g>`;

  // Draw client nodes
  for (let i = 0; i < clients.length; i++) {
    const node = clients[i];
    const total = Math.max(clients.length - 1, 1);
    const angle = -Math.PI/2 + (i / total) * Math.PI;
    const nx = cx + radius * Math.cos(angle);
    const ny = cy + radius * Math.sin(angle);
    html += `<g class="node" data-mac="${node.mac}" data-ip="${node.last_seen_ip || ''}" data-port="${node.last_seen_port || ''}">`;
    html += `<circle cx="${nx}" cy="${ny}" r="12" fill="rgba(139,148,158,0.15)" stroke="#8b949e" stroke-width="1.5"/>`;
    html += `<text x="${nx}" y="${ny + 4}" text-anchor="middle" fill="#8b949e" font-size="8">C</text>`;
    html += `<text x="${nx}" y="${ny + 24}" text-anchor="middle" class="node-name">${node.name}</text>`;
    html += `<text x="${nx}" y="${ny + 36}" text-anchor="middle" class="node-type">${node.mac ? node.mac.slice(-8) : ''}</text></g>`;
    // Hover tooltip
    html += `<rect x="${nx - 40}" y="${ny - 40}" width="80" height="80" fill="transparent" style="cursor:pointer" `;
    html += `onmouseenter="showTooltip(event,'${node.name}','${node.mac || ''}')" onmouseleave="hideTooltip()"/>`;
  }

  svg.innerHTML = html;
}

function showTooltip(e, name, mac, port) {
  const t = document.getElementById('tooltip');
  t.innerHTML = `<b>${name}</b>${mac ? '<br>MAC: ' + mac : ''}${port ? '<br>Port: ' + port : ''}`;
  t.style.display = 'block';
  t.style.left = (e.pageX + 12) + 'px';
  t.style.top = (e.pageY - 10) + 'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

window.addEventListener('load', loadMap);
window.addEventListener('resize', loadMap);
</script>
</body>
</html>
