<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} - API</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:#c9d1d9; font-family:'Inter','Segoe UI',sans-serif; font-size:13px; }
.header { display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(22,27,34,0.85);border-bottom:1px solid #30363d;position:sticky;top:0;z-index:100; }
.header h1 { font-size:16px;font-weight:600;color:#f0f6fc; }
.nav-links { display:flex;gap:8px; }
.nav-links a { font-size:12px;color:#8b949e;padding:4px 8px;border-radius:6px;text-decoration:none; }
.nav-links a:hover { color:#f0f6fc;background:rgba(255,255,255,0.06); }
.container { max-width:1000px; margin:0 auto; padding:20px; }
h2 { font-size:15px;font-weight:600;color:#f0f6fc;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid #21262d; }
h3 { font-size:13px;font-weight:600;color:#f0f6fc;margin:16px 0 8px; }
.endpoint { background:rgba(22,27,34,0.7); border:1px solid #30363d; border-radius:8px; padding:12px; margin-bottom:8px; }
.endpoint .route { display:flex;align-items:center;gap:8px;margin-bottom:6px; }
.method { display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;text-transform:uppercase; }
.get { background:rgba(88,166,255,0.15);color:#58a6ff; }
.post { background:rgba(35,134,54,0.15);color:#3fb950; }
.delete { background:rgba(218,54,51,0.15);color:#f85149; }
.path { font-family:'JetBrains Mono',monospace;font-size:12px;color:#f0f6fc; }
.desc { font-size:12px;color:#8b949e;margin-bottom:4px; }
.params { font-size:11px;color:#8b949e;margin-top:4px;padding:6px;background:#0d1117;border-radius:4px; }
.params code { color:#f0f6fc;font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:14px;">
    <img src="/static/logo.png" alt="logo" style="height:38px;width:38px;border-radius:8px;object-fit:cover;border:1px solid #30363d;">
    <h1>{{ .Title }} - API Reference</h1>
  </div>
  <div class="nav-links">
    <a href="/" data-i18n="nav.dashboard">Dashboard</a>
    <a href="/map" data-i18n="nav.map">Map</a>
    <a href="/config" data-i18n="nav.config">Config</a>
    <a href="/backups" data-i18n="nav.backups">Backups</a>
    <a href="/logs" data-i18n="nav.logs">Logs</a>
    <a href="/api-docs" class="active" data-i18n="nav.api">API</a>
    <select id="lang-select" style="margin-left:8px;padding:4px 6px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:11px;cursor:pointer;" onchange="setLang(this.value)">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>
</div>
<div class="container" id="api-content">
  <p style="color:#8b949e;margin-bottom:16px;">Loading API specification...</p>
</div>
<script>
async function loadAPI() {
  try {
    const res = await fetch('/api/openapi.json');
    const spec = await res.json();
    let html = '<h2>Overview</h2><p style="color:#8b949e;margin-bottom:16px;">' + (spec.info.description || '').replace(/\n/g,'<br>') + '</p>';
    html += '<h2>Endpoints</h2>';
    const cats = {};
    for (const [path, methods] of Object.entries(spec.paths)) {
      for (const [method, detail] of Object.entries(methods)) {
        const cat = path.split('/')[2] || 'general';
        if (!cats[cat]) cats[cat] = [];
        cats[cat].push({ path, method, detail });
      }
    }
    for (const [cat, endpoints] of Object.entries(cats)) {
      html += '<h3>' + cat.charAt(0).toUpperCase() + cat.slice(1) + '</h3>';
      for (const ep of endpoints) {
        const params = ep.detail.parameters || [];
        const hasReq = ep.detail.requestBody;
        html += '<div class="endpoint">';
        html += '<div class="route"><span class="method ' + ep.method + '">' + ep.method + '</span><span class="path">' + ep.path + '</span></div>';
        html += '<div class="desc">' + (ep.detail.description || ep.detail.summary || '') + '</div>';
        if (params.length) {
          html += '<div class="params">Parameters: ';
          html += params.map(p => '<code>' + p.name + '</code> (' + p.schema.type + ')').join(', ');
          html += '</div>';
        }
        if (hasReq) html += '<div class="params">Request body required</div>';
        html += '</div>';
      }
    }
    html += '<p style="color:#8b949e;font-size:11px;margin-top:24px;">Version: ' + spec.info.version + '</p>';
    document.getElementById('api-content').innerHTML = html;
  } catch(e) {
    document.getElementById('api-content').innerHTML = '<p style="color:#f85149;">Failed to load API specification.</p>';
  }
}
loadAPI();
</script>
<script type="module" src="/static/dist/api_docs.js"></script>
</body>
</html>
