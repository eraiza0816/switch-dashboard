<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} - API</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
  body { margin: 0; background: #0d1117; }
  .header { display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(22,27,34,0.85);border-bottom:1px solid #30363d;position:sticky;top:0;z-index:100; }
  .header h1 { font-size:16px;font-weight:600;color:#f0f6fc;margin:0; }
  .nav-links { display:flex;gap:8px;align-items:center; }
  .nav-links a { font-size:12px;color:#8b949e;padding:4px 8px;border-radius:6px;text-decoration:none; }
  .nav-links a:hover { color:#f0f6fc;background:rgba(255,255,255,0.06); }
  #swagger-ui { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .swagger-ui .topbar { display: none !important; }
  .swagger-ui .info { margin: 20px 0; }
  .swagger-ui .info .title { color: #f0f6fc !important; }
  .swagger-ui .info p, .swagger-ui .info a { color: #8b949e !important; }
  .swagger-ui .scheme-container { background: transparent !important; border: none !important; }
</style>
</head>
<body>
<div class="header">
  <h1>{{ .Title }} - API Reference</h1>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/config">Config</a>
    <a href="/backups">Backups</a>
    <a href="/logs">Logs</a>
    <a href="/api-docs" class="active">API</a>
  </div>
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
SwaggerUIBundle({
  url: '/api/openapi.json',
  dom_id: '#swagger-ui',
  deepLinking: true,
  presets: [SwaggerUIBundle.presets.apis],
  defaultModelsExpandDepth: -1,
});
</script>
</body>
</html>
