<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }}</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<style>
  :root { --grid-columns: repeat(auto-fit, minmax(620px, 1fr)); }
  {{ if and .GridColumns (ne .GridColumns "auto") }}
  :root { --grid-columns: repeat({{ .GridColumns }}, 1fr); }
  {{ end }}
</style>
</head>
<body data-font-size="md">
<div class="header">
  <div style="display:flex;align-items:center;gap:14px;">
    <img src="/static/logo.png" alt="logo" style="height:38px;width:38px;border-radius:8px;object-fit:cover;border:1px solid #30363d;">
    <h1>{{ .Title }}</h1>
  </div>
  <div class="nav-links">
    <span class="status"><span class="dot" id="live-dot"></span><span id="live-text">Live</span></span>
    <span class="font-sizes" title="Font size">
      <button class="fs-btn" data-size="sm" onclick="setFontSize('sm')">S</button>
      <button class="fs-btn fs-active" data-size="md" onclick="setFontSize('md')">M</button>
      <button class="fs-btn" data-size="lg" onclick="setFontSize('lg')">L</button>
      <button class="fs-btn" data-size="xl" onclick="setFontSize('xl')">XL</button>
    </span>
    <span class="countdown" id="countdown"></span>
    <a href="/" class="active">Dashboard</a>
    <a href="/config">Config</a>
    <a href="/backups">Backups</a>
    <a href="/logs">Logs</a>
    <a href="javascript:doReset()" id="reset-link" style="color:#da3633;">Reset</a>
  </div>
</div>

<div class="dashboard-grid" id="dashboard-grid"></div>

<div class="modal-overlay" id="graph-modal">
  <div class="modal">
    <h3 id="graph-title">Bandwidth</h3>
    <div class="graph-tabs" id="graph-tabs">
      <button class="graph-tab active" data-range="live">Live</button>
      <button class="graph-tab" data-range="1h">1 Hour</button>
      <button class="graph-tab" data-range="24h">24 Hours</button>
    </div>
    <div class="graph-container" id="graph-container">
      <svg width="100%" height="200" id="graph-svg"><rect width="100%" height="100%" fill="#0d1117" rx="8"/></svg>
    </div>
    <div class="graph-stats" id="graph-stats"></div>
    <p style="margin-top:12px;font-size:11px;color:#8b949e;" id="graph-footer"></p>
  </div>
</div>

<div class="modal-overlay" id="sfp-modal">
  <div class="modal" style="max-width:550px;">
    <h3 id="sfp-title">SFP+ Diagnostics</h3>
    <div id="sfp-content"></div>
  </div>
</div>

<div class="modal-confirm-overlay" id="confirm-modal">
  <div class="modal-confirm">
    <h3 id="confirm-title">Confirm</h3>
    <p id="confirm-msg"></p>
    <div class="btns">
      <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirm-yes" onclick="">Yes</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
window.__DATA__ = {
  refresh: {{ .Refresh }},
  columns: {{ tojson .EnabledColumns }},
  portWrap: {{ .PortsWrapThreshold }}
};
</script>
<script src="/static/dashboard.js"></script>
</body>
</html>
