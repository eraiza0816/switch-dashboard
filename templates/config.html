<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} - Settings</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <h1>{{ .Title }} - Settings</h1>
  <div class="nav-links">
    <a href="/" data-i18n="nav.dashboard">Dashboard</a>
    <a href="/map" data-i18n="nav.map">Map</a>
    <a href="/config" class="active" data-i18n="nav.config">Config</a>
    <a href="/backups" data-i18n="nav.backups">Backups</a>
    <a href="/logs" data-i18n="nav.logs">Logs</a>
  </div>
</div>

<div class="container">
{{ if .Saved }}
<div class="success-msg">&#10003; Configuration saved.</div>
{{ end }}

<form id="config-form" method="POST" action="/config">
<div class="card-full">
<h2>General</h2>
<label>Dashboard Title</label>
<input type="text" name="title" value="{{ .Title }}">
<div style="display:flex;gap:12px;">
<div style="flex:1;">
<label>Refresh Interval (seconds)</label>
<input type="number" name="refresh_interval" value="{{ .Refresh }}" min="1" max="300">
</div>
<div style="flex:1;">
<label>Language</label>
<select id="lang-select" style="width:100%;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:14px;" onchange="setLang(this.value)">
<option value="en">English</option>
<option value="ja">日本語</option>
</select>
</div>
</div>
</div>

<div class="card-full">
<h2>Switches</h2>
<div id="switch-list">
{{ range $i, $sw := .Switches }}
<div class="switch-group" data-index="{{ $i }}">
<h3>Node {{ add $i 1 }} - {{ $sw.Name }}</h3>
<input type="hidden" name="keep[]" value="1">
<div class="form-row">
<div>
<label>Name</label>
<input type="text" name="name[]" value="{{ $sw.Name }}" placeholder="Core Switch">
</div>
<div>
<label>IP Address</label>
<input type="text" name="ip[]" value="{{ $sw.IP }}" placeholder="192.168.10.247">
</div>
</div>
<div class="form-row">
<div>
<label>Password</label>
<input type="password" name="password[]" value="{{ $sw.Password }}" placeholder="1234" autocomplete="current-password">
</div>
<div>
<label>Model</label>
<input type="text" name="model[]" value="{{ $sw.Model }}" readonly style="color:#8b949e;">
</div>
</div>
</div>
{{ end }}
</div>
</div>

<div style="display:flex;gap:8px;margin-bottom:16px;">
<button type="submit" class="btn btn-primary" style="flex:1;">Save Configuration</button>
</div>
</form>

<div class="footer">
<a href="/" data-i18n="footer.back">Dashboard</a> &middot; <a href="/api-docs" data-i18n="footer.api">API</a> &middot; <span class="version-badge">v{{ .Version }}</span>
</div>
</div>
<script type="module" src="/static/dist/dashboard.js"></script>
<script>
// Set language selector to saved preference
var lang = localStorage.getItem('dashboard_lang');
if (lang === 'ja' || lang === 'en') {
  document.getElementById('lang-select').value = lang;
}
document.getElementById('lang-select').addEventListener('change', function() {
  localStorage.setItem('dashboard_lang', this.value);
  window.location.reload();
});
</script>
</body>
</html>
